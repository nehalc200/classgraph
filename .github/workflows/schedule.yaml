name: Quarterly Catalog Scrapers
on:
  schedule:
    # Runs the first Friday of May at 00:00 UTC
    - cron: "0 0 1-7 5 5"
    
    # Runs the first Friday of November at 00:00 UTC
    - cron: "0 0 1-7 11 5"

    # Runs the first Friday of February at 00:00 UTC
    - cron: "0 0 1-7 2 5"
  # Adding manual trigger so you can test it without waiting for the cron
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-course-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update NEWEST_QUARTER constant
        run: |
          MONTH=$(date +%-m)
          YEAR=$(date +%Y)

          if [ "$MONTH" -eq 2 ]; then
            QUARTER="Spring Qtr"
          elif [ "$MONTH" -eq 5 ]; then
            QUARTER="Fall Qtr"
          elif [ "$MONTH" -eq 11 ]; then
            QUARTER="Winter Qtr"
          else
            echo "Unexpected month $MONTH — skipping NEWEST_QUARTER update"
            exit 0
          fi

          echo "Setting NEWEST_QUARTER to: $QUARTER"
          sed -i "s/export const NEWEST_QUARTER = \".*\";/export const NEWEST_QUARTER = \"$QUARTER\";/" src/utils/transcriptParse.js

      - name: Run Catalog scraper
        run: |
          python catalog_scraper/main.py

      - name: Run Webreg scraper
        run: |
          cd soc_scraper/
          go build
          ./soc_scraper
          cd ..

      - name: Run cross check and AST
        run: |
          python data/helpers/cross_check.py
          python data/helpers/ast.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update course data from quarterly scraper"
          branch: scraper-update
          delete-branch: true
          title: "Quarterly Catalog Scraper Update"
          body: |
            Automated update from quarterly catalog scraper.
            
            Run completed on ${{ github.event.repository.updated_at }}
            
            cc @alchin2
          assignees: alchin2

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Quarterly Catalog Scraper Failed',
              body: `Workflow run failed on ${new Date().toISOString()}\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\ncc @alchin2`,
              assignees: ['alchin2']
            })
